<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Usuário</title>
</head>
<body>
    <h1>Cadastrar novo usuário</h1>
    <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
        <label>Nome</label>
        <input type="text" th:field="*{nome}" required/>
        <br><br>

        <label>E-mail</label>
        <input type="email" th:field="*{email}" required/>
        <br><br>

        <label>Senha</label>
        <input type="password" th:field="*{senha}" required/>
        <br><br>

        <label>Telefone</label>
        <input type="text" th:field="*{telefone}" required/>
        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <br>

    <a th:href="@{/usuarios}">Voltar para a lista</a>
</body>
</html>
