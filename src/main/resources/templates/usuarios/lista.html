<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuários</title>
</head>
<body>
    <h1>Usuários cadastrados</h1>
    <a th:href="@{/usuarios/novo}">Cadastrar novo usuário</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Tipo</th>
                <th>Ativo</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.idUsuario}"></td>
                <td th:text="${usuario.nome}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.telefone}"></td>
                <td th:text="${usuario.tipoUsuario}"></td>
                <td th:text="${usuario.ativo ? 'Sim' : 'Não'}"></td>
                <td>
                    <form th:action="@{/usuarios/excluir/{id}(id=${usuario.idUsuario})}" method="post">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="7">Nenhum registro cadastrado</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
